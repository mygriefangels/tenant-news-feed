name: Fetch News Feed
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: mkdir -p docs && node fetch-news.js
      - run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add docs/feed.json
          git diff --staged --quiet || git commit -m "Update news feed"
          git push
